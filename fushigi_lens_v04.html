<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふしぎなレンズ - 練習版</title>
<style>
:root { color-scheme: dark; --green:#9cff83; --panel:#14232d; }
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; background:#08131b; color:#fff;
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  text-align:center;
}
header {
  padding:18px 12px 14px; background:linear-gradient(180deg,#203b43,#10232d);
  color:var(--green); font-weight:900; font-size:clamp(22px,6vw,30px);
  letter-spacing:.08em; text-shadow:0 0 12px #64e58a;
  border-bottom:2px solid #6adf83;
}
main { width:min(720px,100%); margin:auto; padding:16px 14px 34px; }
.subtitle { color:#c7d8d2; margin:8px 0 14px; font-size:14px; }
#stage {
  position:relative; width:100%; min-height:270px; aspect-ratio:4/3;
  overflow:hidden; border:3px solid #79ed83; border-radius:18px;
  background:radial-gradient(ellipse,#29434a,#101e29 70%);
  box-shadow:0 0 22px #57d87855, inset 0 0 22px #0008;
}
#photo { width:100%; height:100%; object-fit:contain; display:none; }
#empty {
  position:absolute; inset:0; display:grid; place-items:center;
  padding:20px; color:#b8d1c4; font-size:16px;
}
#character {
  position:absolute; display:none; width:min(38%,190px); height:auto;
  object-fit:contain; left:50%; top:50%; transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 12px #fff9);
  z-index:2; pointer-events:none;
}
#smoke {
  position:absolute; inset:-15%; z-index:3; pointer-events:none;
  opacity:0; display:none;
  background:
    radial-gradient(ellipse at 15% 60%,#f7f7f7 0 12%,transparent 32%),
    radial-gradient(ellipse at 40% 35%,#d8e1e1 0 17%,transparent 39%),
    radial-gradient(ellipse at 68% 62%,#fff 0 18%,transparent 40%),
    radial-gradient(ellipse at 85% 30%,#cbd5d7 0 15%,transparent 36%),
    radial-gradient(ellipse at 50% 80%,#eef2f2 0 20%,transparent 42%);
  filter:blur(13px);
}
#smoke.play { display:block; animation:smokeBurst 2.15s ease-out forwards; }
@keyframes smokeBurst {
  0% { opacity:0; transform:scale(.35) rotate(0deg); }
  18% { opacity:.98; transform:scale(1.05) rotate(8deg); }
  48% { opacity:1; transform:scale(1.35) rotate(-8deg); }
  100% { opacity:0; transform:scale(1.8) rotate(5deg); }
}
.controls { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:16px 0; }
button {
  border:0; border-radius:999px; padding:13px 20px; min-width:145px;
  background:linear-gradient(#a8ff91,#55ce70); color:#102319;
  font-size:15px; font-weight:800; box-shadow:0 4px 0 #287b48; cursor:pointer;
}
button.secondary { background:linear-gradient(#e4f2f0,#9dbbb8); box-shadow:0 4px 0 #526c6c; }
button:active { transform:translateY(3px); box-shadow:none; }
button:disabled { opacity:.45; cursor:not-allowed; }
#status { min-height:52px; margin:12px 0; color:var(--green); font-weight:800; font-size:18px; }
.panel {
  background:var(--panel); border:1px solid #38515a; border-radius:14px;
  padding:13px; margin-top:14px;
}
.panel h3 { margin:0 0 10px; color:#d9ffe0; font-size:16px; }
#collection { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.yokai-card { min-width:0; background:#0c1921; border-radius:10px; padding:6px; border:1px solid #344a50; }
.yokai-card img { width:100%; height:72px; object-fit:contain; }
.yokai-card span { display:block; font-size:11px; color:#d8e7df; }
.note { color:#9fb5b2; font-size:12px; line-height:1.6; }
input[type=file] { display:none; }
</style>
</head>
<body>
<header>🔍 ふしぎなレンズ</header>
<main>
  <div class="subtitle">写真を撮って、レンズで妖怪を見つけよう！</div>
  <div id="stage">
    <img id="photo" alt="撮影した写真">
    <div id="empty">カメラを起動して撮影するか、写真を選んでね</div>
    <img id="character" alt="発見したキャラクター">
    <div id="smoke"></div>
  </div>

  <input id="camera" type="file" accept="image/*" capture="environment">
  <div class="controls">
    <button id="takePhoto">📷 カメラを起動</button>
    <button id="choosePhoto" class="secondary">🖼 写真を選ぶ</button>
    <button id="scan" disabled>🔎 レンズで調査</button>
  </div>
  <div id="status" aria-live="polite">まずは写真を撮影してね！</div>

  <div class="panel">
    <h3>📖 発見した妖怪：<span id="count">0</span>体</h3>
    <div id="collection"></div>
  </div>
  <p class="note">
    ※「カメラを起動」は端末・ブラウザが対応している場合に背面カメラの撮影画面を開きます。表示方法はiPhoneやブラウザの仕様によります。「写真を選ぶ」から写真ライブラリも使えます。
    写真や画像はこのHTML内で処理し、外部サーバーには送信しません。
  </p>
</main>

const camera = document.getElementById('camera');
const photo = document.getElementById('photo');
const character = document.getElementById('character');
const smoke = document.getElementById('smoke');
const scan = document.getElementById('scan');
const statusText = document.getElementById('status');
const collection = document.getElementById('collection');
const found = new Set();
let photoUrl = null;
let audioCtx = null;

// capture="environment" asks supported mobile browsers to open the rear-camera
// capture flow. The browser/OS decides whether to show a camera UI or chooser.
document.getElementById('takePhoto').addEventListener('click', () => {
  camera.setAttribute('capture', 'environment');
  camera.click();
});

document.getElementById('choosePhoto').addEventListener('click', () => {
  camera.removeAttribute('capture');
  camera.click();
});

camera.addEventListener('change', () => {
  const file = camera.files && camera.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    statusText.textContent = '画像ファイルを選んでね。';
    return;
  }
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = URL.createObjectURL(file);
  photo.onload = () => {
    document.getElementById('empty').style.display = 'none';
    photo.style.display = 'block';
    character.style.display = 'none';
    scan.disabled = false;
    statusText.textContent = '写真を読み込んだよ！レンズで調査してみよう。';
  };
  photo.onerror = () => {
    statusText.textContent = '写真を読み込めなかったよ。別の写真を選んでね。';
  };
  photo.src = photoUrl;
  sound('shutter');
  // Allow selecting/capturing the same image again on the next attempt.
  camera.value = '';
});

scan.addEventListener('click', () => {
  if (!photoUrl) return;
  scan.disabled = true;
  character.style.display = 'none';
  sound('scan');
  statusText.textContent = 'レンズ起動中……妖気を検知！';

  smoke.classList.remove('play');
  smoke.style.display = 'block';
  void smoke.offsetWidth;
  smoke.classList.add('play');

  setTimeout(() => {
    const item = YOKAI[Math.floor(Math.random() * YOKAI.length)];
    character.src = item.data;
    character.style.left = (22 + Math.random() * 56) + '%';
    character.style.top = (25 + Math.random() * 50) + '%';
    character.style.width = (28 + Math.random() * 12) + '%';
    character.style.display = 'block';
    sound('found');
    statusText.textContent = '妖怪を発見！！';
    addToCollection(item);
    scan.disabled = false;
  }, 1550);

  setTimeout(() => {
    smoke.classList.remove('play');
    smoke.style.display = 'none';
  }, 2200);
});

function addToCollection(item) {
  if (found.has(item.name)) return;
  found.add(item.name);
  document.getElementById('count').textContent = found.size;
  const card = document.createElement('div');
  card.className = 'yokai-card';
  const img = document.createElement('img');
  img.src = item.data;
  img.alt = item.name;
  const label = document.createElement('span');
  label.textContent = item.name;
  card.append(img, label);
  collection.append(card);
}
</script>
